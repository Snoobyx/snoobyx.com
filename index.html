    <body>
        <header class="scene">
            <!-- Decorative sky: each layer is 5 identical tiles (phones use 2). Which cloud,
                 where and how fast is in style.css (Scenery). A new cloud needs a
                 <span class="cloud"></span> in EVERY tile of its layer, plus a line there. -->
            <div class="sky" aria-hidden="true">
                <div class="far">
                    <div class="tile"><span class="cloud"></span><span class="cloud"></span><span class="cloud"></span><span class="cloud"></span><span class="cloud"></span></div>
                    <div class="tile"><span class="cloud"></span><span class="cloud"></span><span class="cloud"></span><span class="cloud"></span><span class="cloud"></span></div>
                    <div class="tile"><span class="cloud"></span><span class="cloud"></span><span class="cloud"></span><span class="cloud"></span><span class="cloud"></span></div>
                    <div class="tile"><span class="cloud"></span><span class="cloud"></span><span class="cloud"></span><span class="cloud"></span><span class="cloud"></span></div>
                    <div class="tile"><span class="cloud"></span><span class="cloud"></span><span class="cloud"></span><span class="cloud"></span><span class="cloud"></span></div>
                </div>
                <div class="near">
                    <div class="tile"><span class="cloud"></span><span class="cloud"></span><span class="cloud"></span></div>
                    <div class="tile"><span class="cloud"></span><span class="cloud"></span><span class="cloud"></span></div>
                    <div class="tile"><span class="cloud"></span><span class="cloud"></span><span class="cloud"></span></div>
                    <div class="tile"><span class="cloud"></span><span class="cloud"></span><span class="cloud"></span></div>
                    <div class="tile"><span class="cloud"></span><span class="cloud"></span><span class="cloud"></span></div>
                </div>
            </div>
            <h1 class="logo">
                <!-- First match wins. Ranges must match style.css (Scenery). -->
                <picture>
                    <source media="(width > 960px) and (resolution >= 2dppx)"    srcset="snoobyx@4x.png"     width="960" height="320" /> <!-- Mac, 4K at 200% -->
                    <source media="(width > 960px) and (resolution >= 1.5dppx)"  srcset="snoobyx@3x.png"     width="960" height="320" /> <!-- laptops at 150% -->
                    <source media="(width > 960px) and (resolution >= 1.25dppx)" srcset="snoobyx@2x.png"     width="768" height="256" /> <!-- laptops at 125% -->
                    <source media="(width > 960px)"                              srcset="snoobyx@2x.png"     width="960" height="320" /> <!-- desktop -->
                    <source media="(width > 480px) and (resolution >= 2.9dppx)"  srcset="snoobyx@3x.png"     width="480" height="160" /> <!-- iPhones sideways -->
                    <source media="(width > 480px) and (resolution >= 2dppx)"    srcset="snoobyx@2x.png"     width="480" height="160" /> <!-- iPad -->
                    <source media="(resolution >= 2.9dppx)"                      srcset="snoobyx-iphone.png" width="320" height="107" /> <!-- iPhones: @2x + 1 empty row, as 106.67px can't be exact -->
                    <source media="(resolution >= 2.5dppx)"                      srcset="snoobyx@2x.png"     width="366" height="122" /> <!-- most Androids (2.625x) -->
                    <source media="(resolution >= 1.5dppx)"                      srcset="snoobyx.png"        width="240" height="80" /> <!-- 2x phones: iPhone SE, older iPhones -->
                    <img src="snoobyx.png" width="480" height="160" alt="Snoobyx" />
                </picture>
            </h1>
        </header>
