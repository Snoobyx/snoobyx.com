                    <!-- Desktop: more than 960px wide -->

                        srcset="snoobyx@4x.png"
                        width="960"
                        height="320"
                    /><!-- Mac, 4K at 200% -->

                        media="(width > 960px) and (resolution >= 1.5dppx)"
                        srcset="snoobyx@3x.png"
                        width="960"
                        height="320"

                        media="(width > 960px)"
                        srcset="snoobyx@2x.png"
                        width="960"
                        height="320"
                    /><!-- normal screens -->

                    <!-- Tablets, small windows, phones sideways: 481–960px wide -->
                    <source
                        media="(width > 480px) and (resolution >= 2.9dppx)"
                        srcset="snoobyx@3x.png"
                        width="480"
                        height="160"
                    /><!-- iPhones sideways -->
                    <source
                        media="(width > 480px) and (resolution >= 2dppx)"
                        srcset="snoobyx@2x.png"
                        width="480"
                        height="160"
                    /><!-- iPad -->

                    <!-- Phones: up to 480px wide -->
                    <source
                        media="(resolution >= 2.9dppx)"
                        srcset="snoobyx-iphone.png"
                        width="320"
                        height="107"
                    /><!-- iPhones. @2x + 1 white row: 320 tall is 106.67px at 3x, which CSS can't do -->
                    <source
                        media="(resolution >= 2.5dppx)"
                        srcset="snoobyx@2x.png"
                        width="366"
                        height="122"
                    /><!-- most Androids (2.625x) -->
                    <source
                        media="(resolution >= 1.5dppx)"
                        srcset="snoobyx.png"
                        width="240"
                        height="80"
                    /><!-- 2x phones: iPhone SE, older iPhones -->

                    <!-- Everything else -->
                    <img src="snoobyx.png" width="480" height="160" alt="Snoobyx" />
                </picture>
